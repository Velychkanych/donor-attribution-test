<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <title>Donor Attribution Test</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<form id="donateForm">
    <h1>Зробіть донат</h1>

    <label for="amount">Сума донату (грн):</label>
    <input type="number" id="amount" name="amount" required />

    <input type="hidden" id="client_id" />
    <input type="hidden" id="utm_source" />
    <input type="hidden" id="utm_medium" />
    <input type="hidden" id="utm_campaign" />

    <button type="submit">Задонатити</button>
</form>

<script src="script.js"></script>
</body>
</html>
